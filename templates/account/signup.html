{% extends "acc_base.html" %}
{% block title %}تسجيل {% endblock title %}   
{% block body %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 rounded shadow-sm">
                <h2 class="mb-4 text-center">إنشاء حساب جديد</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- تحميل واستخدام فلتر crispy هنا -->
                    {% load crispy_forms_tags %}
                    {{ form|crispy }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">تسجيل</button>
                                        {% load socialaccount %}
                    <div class="mt-3 text-center">
                        <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100">
                            <i class="fab fa-google"></i> تسجيل الدخول بواسطة Google
                        </a>
                    </div>
                    <p> لديك حساب؟ <a href="{%url 'account_login'%}">تسجيل الدخول</a></p>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول</title>
    <!-- استدعاء Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
    
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 rounded shadow-sm">
                <h2 class="mb-4 text-center"> تسجيل الدخول </h2>
                <!-- عرض رسائل التنبيه والخطأ (مثل ضرورة تفعيل البريد) -->
                {% if messages %}
                    <div class="mb-3">
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- تحميل واستخدام فلتر crispy هنا -->
                    {% load crispy_forms_tags %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">دخول</button>
                    {% load socialaccount %}
                    <div class="mt-3 text-center">
                        <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100">
                            <i class="fab fa-google"></i> تسجيل الدخول بواسطة Google
                        </a>
                    </div>
                    <p>ليس لديك حساب؟ <a href="{%url 'account_signup'%}">انشاء حساب</a></p>
                </form>
            </div>
        </div>
    </div>
    

</body>
</html>

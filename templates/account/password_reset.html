
{% extends "acc_base.html" %}
{% block title %}اعادة تعيين كلمة المرور{% endblock title %}   
{% block body %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 rounded shadow-sm">
                <h2 class="mb-4 text-center"> تعيين كلمة المرور </h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- تحميل واستخدام فلتر crispy هنا -->
                    {% load crispy_forms_tags %}
                    {{ form|crispy }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3" onclick="alert('سيتم ارسال رابط تعيين كلمة المرور عبر البريد')">ارسال</button>
                    {% comment %} <p> لديك حساب؟ <a href="{%url 'Home'%}"> </a></p> {% endcomment %}
                </form>
            </div>
        </div>
    </div>
{% endblock %}

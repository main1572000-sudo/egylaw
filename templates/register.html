<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد</title>
    <!-- استدعاء Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 rounded shadow-sm">
                <h2 class="mb-4 text-center">إنشاء حساب جديد</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- تحميل واستخدام فلتر crispy هنا -->
                    {% load crispy_forms_tags %}
                    {{ form|crispy }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">تسجيل</button>
                    <p> لديك حساب؟ <a href="{%url 'login'%}">تسجيل الدخول</a></p>
                </form>
            </div>
        </div>
    </div>

</body>
</html>

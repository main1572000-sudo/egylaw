<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password_changed</title>
    <style>
        /* تنسيقات صفحة نجاح تغيير كلمة المرور */
        .success-page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            padding: 20px;
        }

        .success-card {
            background-color: var(--panel-black);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }

        .success-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* أيقونة التحقق */
        .success-icon {
            font-size: 4rem;
            color: #2ecc71;
            /* لون أخضر هادئ وواضح للنجاح */
            margin-bottom: 20px;
        }

        /* النصوص */
        .success-content h1 {
            color: var(--text-white);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .success-content p {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* زر العودة المخصص بالثيم الذهبي */
        .btn-archive-return {
            background: linear-gradient(135deg, var(--gold-primary), #b89728);
            color: var(--bg-black);
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: var(--transition);
            width: 100%;
        }

        .btn-archive-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        }
    </style>
</head>

<body>
    <div class="success-page-wrapper">
        <div class="success-card">
            <!-- أيقونة النجاح -->
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <!-- رسالة النجاح -->
            <div class="success-content">
                <h1>تم تغيير كلمة المرور بنجاح</h1>
                <p>لقد تم تحديث كلمة المرور الخاصة بك وإتمام العملية بأمان.</p>
            </div>

            <!-- زر العودة -->
            <div class="success-action">
                <a href="{% url 'archive' %}" class="btn-archive-return">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> العودة للأرشيف 🔚
                </a>
            </div>
        </div>
    </div>
</body>

</html>
